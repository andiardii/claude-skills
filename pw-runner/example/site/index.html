<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Login - Demo Desa</title></head>
<body>
  <h1>Masuk</h1>
  <form id="f">
    <label>Email <input id="email" type="email"></label><br>
    <label>Password <input id="password" type="password"></label><br>
    <button type="submit">Masuk</button>
  </form>
  <p id="err" style="color:red"></p>
  <script>
    document.getElementById('f').onsubmit = e => {
      e.preventDefault();
      if (document.getElementById('password').value === 'rahasia') location.href = 'penduduk.html';
      else document.getElementById('err').textContent = 'Email atau password salah';
    };
  </script>
</body>
</html>
